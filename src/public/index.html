<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRMPLUS - Hệ thống Quản trị & Chăm sóc Khách hàng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- MODERN LOGIN VIEW -->
  <div id="login-view" class="auth-container">
    <!-- Ambient Decor: Grid, Rings, Spotlight & Luminous Mesh Orbs -->
    <div class="auth-bg-decor">
      <div class="auth-grid-pattern"></div>
      <div class="auth-rings">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
      </div>
      <div class="auth-spotlight"></div>
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="glow-orb orb-3"></div>
      <div class="glow-orb orb-4"></div>
    </div>

    <!-- Top Corner Theme Toggle -->
    <div class="login-topbar-actions">
      <button type="button" id="btn-theme-toggle-login" class="theme-toggle-btn login-theme-toggle" title="Chuyển chế độ Sáng / Tối">
        <svg class="theme-icon-sun" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <svg class="theme-icon-moon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </div>

    <div class="auth-wrapper-modern">
      <!-- Centered Glassmorphism Login Card -->
      <div class="auth-card-modern">
        <div class="auth-card-inner">
          <div class="auth-header">
            <div class="brand-badge-logo" id="login-logo-btn" title="Bấm vào logo CRM+ để hiển thị tùy chọn nâng cao">
              <span>CRM</span><small>+</small>
            </div>
            <div class="auth-header-text">
              <h1 class="auth-title">Chào mừng trở lại!</h1>
              <p class="auth-subtitle">Vui lòng đăng nhập để vào hệ thống</p>
            </div>
          </div>

          <form id="login-form" class="auth-form-modern">
            <!-- CHỌN LOẠI MẬT KHẨU ĐĂNG NHẬP (MẶC ĐỊNH ẨN, BẤM LOGO CRM+ ĐỂ HIỂN THỊ) -->
            <div class="login-type-switch hidden" id="login-type-switch">
              <label class="login-type-btn">
                <input type="radio" name="login_type" value="default" />
                <span class="type-pill">
                  <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                  <span>Mặc định</span>
                </span>
              </label>
              <label class="login-type-btn">
                <input type="radio" name="login_type" value="md5" checked />
                <span class="type-pill">
                  <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                  <span>Mã hóa MD5</span>
                </span>
              </label>
            </div>

            <div class="input-field-group">
              <label for="login-username">Tài khoản nhân viên</label>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                  </svg>
                </span>
                <input id="login-username" type="text" placeholder="Nhập tên đăng nhập..." autocomplete="username" required />
              </div>
            </div>

            <div class="input-field-group">
              <div class="field-label-row">
                <label for="login-password">Mật khẩu</label>
              </div>
              <div class="input-wrapper">
                <span class="input-icon">
                  <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                  </svg>
                </span>
                <input id="login-password" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required />
                <button type="button" class="btn-toggle-pwd" id="btn-toggle-pwd" tabindex="-1" title="Hiện/ẩn mật khẩu">
                  <svg id="eye-icon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
            </div>

            <div id="login-error" class="modern-alert error hidden">
              <span class="alert-icon">⚠️</span>
              <span id="login-error-text"></span>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-modern-primary">
              <span class="btn-text">Đăng nhập ngay</span>
              <span class="btn-arrow">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
              </span>
            </button>

            <!-- ICON DANH SÁCH NHÂN VIÊN DƯỚI NÚT ĐĂNG NHẬP (MẶC ĐỊNH ẨN, BẤM LOGO CRM+ ĐỂ HIỂN THỊ) -->
            <button type="button" id="btn-login-staff-list" class="btn-staff-list-link hidden">
              <svg width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
              </svg>
              <span>Danh sách nhân viên</span>
            </button>
          </form>

          <div class="auth-card-footer" style="display:none !important">
            <button id="open-db-config-login" type="button" class="btn-db-config-link" style="display:none !important">
              <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
              Cấu hình thông số SQL Server
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="app-view" class="app-shell hidden">
    <!-- Mobile Backdrop Drawer Overlay -->
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div class="brand-badge-logo sm">
          <span>CRM</span><small>+</small>
        </div>
        <div class="brand-info">
          <strong>CRMPLUS</strong>
          <small>Enterprise System</small>
        </div>
        <button id="btn-sidebar-collapse" class="btn-sidebar-close" title="Ẩn danh sách chức năng">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
          </svg>
        </button>
      </div>
      <nav class="nav-menu" id="nav-menu">
        <button class="nav-item active" data-page="tasks">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
          </span>
          <span class="nav-label">Công việc (Tasklist)</span>
        </button>

        <button class="nav-item" data-page="ktv-time">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
          <span class="nav-label">Thống kê Time KTV</span>
        </button>

        <button class="nav-item" data-page="customer-search">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
            </svg>
          </span>
          <span class="nav-label">Tra cứu Khách hàng</span>
        </button>

        <button class="nav-item" data-page="sales-stats">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
            </svg>
          </span>
          <span class="nav-label">Thống kê SP Bán ra</span>
        </button>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card-modern">
          <div class="user-avatar-modern" id="user-avatar">NV</div>
          <div class="user-meta-modern">
            <strong id="user-name">Nhân viên</strong>
            <small id="user-dept">Bộ phận</small>
          </div>
        </div>
        <button id="logout-btn" class="btn-logout-modern" title="Đăng xuất khỏi hệ thống">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
          <span>Đăng xuất</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar-modern">
        <div class="topbar-left">
          <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="Ẩn/Hiện danh sách chức năng">
            <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
            </svg>
            <span class="btn-toggle-sidebar-label">Danh sách chức năng</span>
          </button>
          <div class="page-title-badge">
            <span class="badge-dot-live"></span>
            <h2 id="page-title">Công việc KTV</h2>
          </div>
        </div>
        <div class="topbar-actions" style="display:none !important">
          <button id="open-db-config-top" class="btn-topbar-action" style="display:none !important">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/>
            </svg>
            <span>Cấu hình SQL</span>
          </button>
        </div>
        <div class="topbar-right">
          <button id="btn-theme-toggle" class="btn-theme-toggle" type="button" title="Chuyển chế độ Sáng / Tối" aria-label="Toggle theme">
            <svg class="theme-icon-sun" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <svg class="theme-icon-moon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          </button>
          <div class="topbar-user-pill">
            <span class="topbar-avatar" id="topbar-user-avatar">NV</span>
            <span class="topbar-username" id="topbar-user-name">Nhân viên</span>
          </div>
        </div>
      </header>

      <section id="page-content" class="page-content"></section>
    </main>
  </div>

  <!-- MODAL CONTAINER -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card" id="modal-card">
      <div class="modal-header">
        <h3 id="modal-title">Tiêu đề</h3>
        <button id="modal-close" class="icon-btn" type="button">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/app.js"></script>
</body>
</html>
